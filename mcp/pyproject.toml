[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outcome-ledger-mcp"
version = "1.0.0"
description = "Local MCP server — fetch AI usage and GitHub outcomes, sync to Outcome Ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
outcome-ledger-mcp = "outcome_ledger_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/outcome_ledger_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
