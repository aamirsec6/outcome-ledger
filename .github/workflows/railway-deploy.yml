# Path-aware Railway deploys (monorepo). Requires RAILWAY_TOKEN in repo secrets.
# Run scripts/railway-ensure-monorepo.sh once so GitHub→Railway also uses root dirs + Dockerfile.

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ensure-monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Railway root directories
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skip ensure (set secret or run scripts/railway-ensure-monorepo.sh locally)"
            exit 0
          fi
          chmod +x scripts/railway-ensure-monorepo.sh
          ./scripts/railway-ensure-monorepo.sh

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            dashboard:
              - 'dashboard/**'
            landing:
              - 'landing/**'

  deploy-api:
    needs: [ensure-monorepo, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skip deploy (add GitHub secret or deploy via Railway GitHub integration)"
            exit 0
          fi
          railway link --project outcome-ledger --environment production --service outcome-ledger
          railway up api --path-as-root --detach

  deploy-dashboard:
    needs: [ensure-monorepo, changes]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy dashboard
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skip deploy (add GitHub secret or deploy via Railway GitHub integration)"
            exit 0
          fi
          railway link --project outcome-ledger --environment production --service outcome-ledger-dashboard
          railway up dashboard --path-as-root --detach

  deploy-landing:
    needs: [ensure-monorepo, changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy landing
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skip deploy (add GitHub secret or deploy via Railway GitHub integration)"
            exit 0
          fi
          railway link --project outcome-ledger --environment production --service outcome-ledger-landing
          railway up landing --path-as-root --detach
