# Railway service: outcome-ledger-dashboard — Root Directory MUST be: dashboard

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/dashboard/**", "/api/app/metrics.py", "/api/app/attribution.py"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
