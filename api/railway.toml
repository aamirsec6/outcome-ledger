# Railway service: outcome-ledger — Root Directory MUST be: api

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/api/**", "/dashboard/lib/format.ts", "/dashboard/components/cpst-chart.tsx"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
